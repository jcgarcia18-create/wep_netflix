services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongo_db
      - postgres_db
    volumes:
      - ./:/var/www
    networks:
      - netflix

  vite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netflix-vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    ports:
      - "5173:5173"
    command: npm run dev
    networks:
      - netflix

  nginx:
    image: nginx:alpine
    container_name: netflix-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - netflix

  mongo_db:
    image: mongo:latest
    container_name: netflix-mongo-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - netflix-mongo-db-data:/data/db
    networks:
      - netflix

  postgres_db:
    image: postgres:15-alpine
    container_name: netflix-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_PGSQL_DATABASE}
      POSTGRES_USER: ${DB_PGSQL_USERNAME}
      POSTGRES_PASSWORD: ${DB_PGSQL_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - netflix-postgres-db-data:/var/lib/postgresql/data
    networks:
      - netflix

networks:
  netflix:
    driver: bridge

volumes:
  netflix-mongo-db-data:
    driver: local
  netflix-postgres-db-data:
    driver: local
